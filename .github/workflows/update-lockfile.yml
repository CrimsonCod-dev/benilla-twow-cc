# Manual on-demand helper workflow to regenerate Cargo.lock in CI
# when local toolchain is unavailable or adding workspace dependencies.
name: Regenerate Cargo.lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: regenerate Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check --workspace (updates Cargo.lock)
        run: cargo check --workspace

      - name: Commit updated Cargo.lock if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date -- nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "ci: regenerate Cargo.lock"
            git push
          fi
