# Lightweight CI gates for PRs, main branch commits, and manual triggers.
# Runs on Linux without requiring a WoW install or display.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # No debuginfo: it is most of target/, and a runner's disk is small.
      CARGO_PROFILE_DEV_DEBUG: 0
      # Set and empty: no install, as the gates' test-no-install runs.
      WOW_DATA: ""
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Linux system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: doc-links
        run: scripts/doc-links.py

      - name: pass-span-lint
        run: scripts/pass-span-lint.py

      - name: player-tests
        run: cargo test -p benilla-formats -p benilla-app --no-default-features --lib
