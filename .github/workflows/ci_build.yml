# Manual / On-Demand Artifact Builds
# Optimized for GitHub Free Tier limits (~2000 runner minutes/month and 500 MB artifact storage).
#
# Heavy artifact builds (Android APK, Desktop binaries, Perf builds) do NOT run automatically
# on push or PR to prevent burning free runner minutes and storage quota.
#
# How to run:
#   1. Go to Actions tab -> "Artifact Build (Manual)" -> "Run workflow".
#   2. By default, "Build Android APK (aarch64)" is checked.
#   3. Optionally check "Build Desktop binaries", "Build Perf/Ship binaries", or "Regenerate Cargo.lock".

name: Artifact Build (Manual)

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android APK (aarch64)"
        type: boolean
        default: true
      build_desktop:
        description: "Build Desktop binaries (Linux, Windows, macOS)"
        type: boolean
        default: false
      build_perf:
        description: "Build Perf/Ship binaries (Linux, Windows, macOS)"
        type: boolean
        default: false
      update_lockfile:
        description: "Regenerate Cargo.lock"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual lockfile update when dependencies change without local toolchain.
  # Run this via Actions tab -> "Artifact Build (Manual)" -> "Run workflow" with `update_lockfile` checked.
  update-lockfile:
    name: regenerate Cargo.lock
    if: ${{ inputs.update_lockfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check --workspace (updates Cargo.lock)
        run: cargo check --workspace

      - name: Commit updated Cargo.lock if changed
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "ci: regenerate Cargo.lock"
            git push
          else
            echo "Cargo.lock already up to date -- nothing to commit."
          fi

  # Android APK Build (aarch64) - Primary Artifact
  android:
    name: build (android)
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add Android target to the pinned toolchain
        run: rustup target add aarch64-linux-android

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install pinned SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-31" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_RELEASE_KEYSTORE secret is not set -- building debug APK"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: cargo apk build -p benilla-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cargo apk build --release -p benilla-android
          else
            cargo apk build -p benilla-android
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: benilla-android-aarch64.apk
          path: |
            target/release/apk/*.apk
            target/debug/apk/*.apk
          if-no-files-found: error
          retention-days: 3

  # Desktop Binaries (Linux, Windows, macOS) - Manual only
  build:
    name: build (${{ matrix.os }})
    if: ${{ inputs.build_desktop }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: benilla
            asset_name: benilla-linux-x86_64
          - os: windows-latest
            artifact_name: benilla.exe
            asset_name: benilla-windows-x86_64.exe
          - os: macos-latest
            artifact_name: benilla
            asset_name: benilla-macos-x86_64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo build --release -p benilla
        run: cargo build --release --locked -p benilla

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 3

  # Perf/Ship Builds - Manual only
  perf:
    name: perf build (${{ matrix.os }})
    if: ${{ inputs.build_perf }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: benilla
            asset_name: benilla-perf-linux-x86_64
          - os: windows-latest
            artifact_name: benilla.exe
            asset_name: benilla-perf-windows-x86_64.exe
          - os: macos-latest
            artifact_name: benilla
            asset_name: benilla-perf-macos-x86_64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ship
          cache-on-failure: true

      - name: cargo build --profile ship --no-default-features -p benilla
        run: cargo build --profile ship --locked --no-default-features -p benilla

      - name: Upload perf build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/ship/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 3
