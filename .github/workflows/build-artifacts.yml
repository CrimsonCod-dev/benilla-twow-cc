# On-demand and Release artifact build workflow for Windows and Android.
# Artifacts are produced ONLY when manually triggered (workflow_dispatch)
# or when a GitHub Release is published.
name: Build Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform(s) to build"
        required: true
        type: choice
        options:
          - windows
          - android
          - both
        default: windows
      build_type:
        description: "Build profile (ship = optimized player build, dev = debug/tools build, both = build both)"
        required: true
        type: choice
        options:
          - ship
          - dev
          - both
        default: ship
      upload_artifact:
        description: "Upload build results to Actions Artifacts"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: build (windows)
    if: github.event_name == 'release' || inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set Short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ inputs.build_type || 'ship' }}
          cache-on-failure: true

      - name: cargo build --profile ship -p benilla
        if: github.event_name == 'release' || inputs.build_type == 'ship' || inputs.build_type == 'both'
        run: cargo build --profile ship --locked --no-default-features -p benilla

      - name: Upload ship build artifact
        if: (github.event_name == 'release' || inputs.upload_artifact == true) && (github.event_name == 'release' || inputs.build_type == 'ship' || inputs.build_type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: benilla-windows-x64-ship-${{ env.SHORT_SHA }}
          path: target/ship/benilla.exe
          retention-days: 7
          if-no-files-found: error

      - name: cargo build --release -p benilla (dev profile)
        if: inputs.build_type == 'dev' || inputs.build_type == 'both'
        run: cargo build --release --locked -p benilla

      - name: Upload dev build artifact
        if: inputs.upload_artifact == true && (inputs.build_type == 'dev' || inputs.build_type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: benilla-windows-x64-dev-${{ env.SHORT_SHA }}
          path: target/release/benilla.exe
          retention-days: 7
          if-no-files-found: error

  android:
    name: build (android)
    if: github.event_name == 'release' || inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add Android target to pinned toolchain
        run: rustup target add aarch64-linux-android

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install pinned SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-31" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_RELEASE_KEYSTORE secret is not set -- building debug APK"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "dev" ]; then
            cargo apk build -p benilla-android
          elif [ "$HAS_KEYSTORE" = "true" ]; then
            cargo apk build --release -p benilla-android
          else
            cargo apk build -p benilla-android
          fi

      - name: Upload Android build artifact
        if: github.event_name == 'release' || inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: benilla-android-arm64-${{ env.SHORT_SHA }}
          path: |
            target/release/apk/*.apk
            target/debug/apk/*.apk
          retention-days: 7
          if-no-files-found: error

  release-publish:
    name: publish release assets
    needs: [windows, android]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.apk" \) -exec gh release upload "${{ github.event.release.tag_name }}" {} --clobber \;
